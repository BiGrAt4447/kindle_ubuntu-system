pre-start script
     echo "Log from $(date)" > /mnt/us/ubuntu/xfce.log
     exec >>/mnt/us/xfce.log 2>&1
     echo "# Ubuntu ::: pre-start script"
  
     echo "Starting Ubuntu"
     mkdir -p /mnt/us/ubuntu/mnt
     mount -o loop /mnt/us/ubuntu/ubuntu.ext4 /mnt/us/ubuntu/mnt
     mount -o bind /dev /mnt/us/ubuntu/mnt/dev
     mount -o bind /dev/pts /mnt/us/ubuntu/mnt/dev/pts
     mount -o bind /proc /mnt/us/ubuntu/mnt/proc
     mount -o bind /sys /mnt/us/ubuntu/mnt/sys
     mount -o bind /var/run/dbus /mnt/us/ubuntu/mnt/run/dbus
     mount -o bind /tmp /mnt/us/ubuntu/mnt/tmp
     chmod a+w /dev/shm
end script

script
     exec >>/mnt/us/ubuntu/xfce.log 2>&1
     echo "# Ubuntu ::: script"
     
     sleep 1
     stop lab126_gui
     
     chroot /mnt/us/ubuntu/mnt /bin/su - kindle /startgui.sh
#     su -c "chroot /mnt/us/ubuntu/mnt /startgui.sh"
     
     killall Xephyr
end script

post-stop script
     exec >>/mnt/us/ubuntu/xfce.log 2>&1
     echo "# Ubuntu ::: post-stop script"
     
     echo "Unmounting Ubuntu"
     LOOPDEV="$(mount | grep loop | grep /mnt/us/ubuntu/mnt | cut -d" " -f1)"
     unmount /mnt/us/ubuntu/mnt/run/dbus
     unmount /mnt/us/ubuntu/mnt/sys
     sleep 1
     unmount /mnt/us/ubuntu/mnt/proc
     unmount /mnt/us/ubuntu/mnt/dev/pts
     unmount /mnt/us/ubuntu/mnt/dev
     # Sync beforhand so unmount doesn't fail due to device being busy still
     sync
     unmount /mnt/us/ubuntu/mnt || true
     # Sometimes it fails still and only works by trying again
     while ["$(mount | grep /mnt/us/ubuntu/mnt)"]
     do
          echo "Ubuntu is still mounted trying again shortly…"
          sleep 3
          unmount /mnt/us/ubuntu/mnt || true
     done
     echo "Ubuntu unmounted
     echo "Disassociating loop device >>$LOOPDEV<<"
     losetup -d $LOOPDEV
     echo "All done, starting kindle's gui"
     
     start lab126_gui
end script
